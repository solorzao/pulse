name: Deploy API

on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - "seed/**"
      - ".github/workflows/api.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-api
  cancel-in-progress: false

env:
  ACR_NAME: ${{ vars.ACR_NAME }}
  RESOURCE_GROUP: ${{ vars.RESOURCE_GROUP }}
  CONTAINER_APP: ${{ vars.CONTAINER_APP }}
  IMAGE_REPO: pulse-api

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build image in ACR
        run: |
          az acr build -r "$ACR_NAME" -f api/Dockerfile \
            -t "$IMAGE_REPO:${{ github.sha }}" -t "$IMAGE_REPO:latest" .

      - name: Deploy to Container Apps
        run: |
          az extension add --name containerapp --upgrade --only-show-errors -y
          SERVER="$(az acr show -n "$ACR_NAME" --query loginServer -o tsv)"
          az containerapp update -n "$CONTAINER_APP" -g "$RESOURCE_GROUP" \
            --image "$SERVER/$IMAGE_REPO:${{ github.sha }}" -o none
          FQDN="$(az containerapp show -n "$CONTAINER_APP" -g "$RESOURCE_GROUP" \
            --query properties.configuration.ingress.fqdn -o tsv)"
          echo "FQDN=$FQDN" >> "$GITHUB_ENV"
          echo "Deployed https://$FQDN" >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke test /health
        run: |
          for i in $(seq 1 20); do
            if body="$(curl -fsS --max-time 10 "https://$FQDN/health")"; then
              echo "healthy: $body"
              exit 0
            fi
            echo "attempt $i failed, retrying in 10s..."
            sleep 10
          done
          echo "health check failed" >&2
          exit 1
